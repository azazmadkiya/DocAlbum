name: Build and Release APK and AAB (Debug & Release)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version: $JAVA_VERSION"
          JAVA_MAJOR=$(echo "$JAVA_VERSION" | awk -F'.' '{print $1}')
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VERSION" | awk -F'.' '{print $2}')
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer, found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java version verification passed: >= 17"

      - name: Create temporary keystores before Gradle configuration
        run: |
          echo "Generating temporary debug keystore..."
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "./debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          echo "Generating temporary release keystore..."
          keytool -genkeypair \
            -alias upload \
            -keypass android \
            -keystore "./my-upload-key.jks" \
            -storepass android \
            -dname "CN=Android Release,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          if [ ! -f "./debug.keystore" ] || [ ! -f "./my-upload-key.jks" ]; then
            echo "Error: Failed to create temporary keystores."
            exit 1
          fi
          echo "Keystores successfully created and verified."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build APK and App Bundles (Debug & Release)
        env:
          KEYSTORE_PATH: "./my-upload-key.jks"
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
        run: |
          gradle :app:assembleDebug :app:bundleDebug :app:bundleRelease --stacktrace --no-daemon

      - name: Verify APK and AAB outputs
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          DEBUG_AAB_PATH="app/build/outputs/bundle/debug/app-debug.aab"
          RELEASE_AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: Expected APK not found or empty at $APK_PATH"
            exit 1
          fi
          if [ ! -f "$DEBUG_AAB_PATH" ] || [ ! -s "$DEBUG_AAB_PATH" ]; then
            echo "Error: Expected Debug AAB not found or empty at $DEBUG_AAB_PATH"
            exit 1
          fi
          if [ ! -f "$RELEASE_AAB_PATH" ] || [ ! -s "$RELEASE_AAB_PATH" ]; then
            echo "Error: Expected Release AAB not found or empty at $RELEASE_AAB_PATH"
            exit 1
          fi
          
          echo "All APK and AAB outputs verified successfully."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload debug AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Prepare release assets
        id: prepare_assets
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          SANITIZED_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          RUN_NUMBER="${{ github.run_number }}"
          
          ASSET_DIR=$(mktemp -d)
          
          APK_NAME="${SANITIZED_REPO}-debug-build-${RUN_NUMBER}.apk"
          DEBUG_AAB_NAME="${SANITIZED_REPO}-debug-bundle-${RUN_NUMBER}.aab"
          RELEASE_AAB_NAME="${SANITIZED_REPO}-release-bundle-${RUN_NUMBER}.aab"
          
          APK_DEST="$ASSET_DIR/$APK_NAME"
          DEBUG_AAB_DEST="$ASSET_DIR/$DEBUG_AAB_NAME"
          RELEASE_AAB_DEST="$ASSET_DIR/$RELEASE_AAB_NAME"
          
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_DEST"
          cp app/build/outputs/bundle/debug/app-debug.aab "$DEBUG_AAB_DEST"
          cp app/build/outputs/bundle/release/app-release.aab "$RELEASE_AAB_DEST"
          
          if [ ! -f "$APK_DEST" ] || [ ! -f "$DEBUG_AAB_DEST" ] || [ ! -f "$RELEASE_AAB_DEST" ]; then
            echo "Error: Failed to prepare release assets."
            exit 1
          fi
          
          echo "Prepared release assets in $ASSET_DIR"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "debug_aab_path=$DEBUG_AAB_DEST" >> $GITHUB_OUTPUT
          echo "release_aab_path=$RELEASE_AAB_DEST" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "debug_aab_name=$DEBUG_AAB_NAME" >> $GITHUB_OUTPUT
          echo "release_aab_name=$RELEASE_AAB_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK and AABs to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          APK_PATH="${{ steps.prepare_assets.outputs.apk_path }}"
          DEBUG_AAB_PATH="${{ steps.prepare_assets.outputs.debug_aab_path }}"
          RELEASE_AAB_PATH="${{ steps.prepare_assets.outputs.release_aab_path }}"
          
          RUN_NUMBER="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          TAG="apk-aab-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          TITLE="APK & App Bundle Build #${RUN_NUMBER}"
          
          NOTES="This is an automatically generated APK and Android App Bundle (AAB) build.
          - Built by GitHub Actions
          - Run Number: ${RUN_NUMBER}
          - Run Attempt: ${RUN_ATTEMPT}
          - Source Commit SHA: ${{ github.sha }}
          - Includes Debug APK, Debug AAB, and Release AAB (built via gradle :app:bundleRelease)
          - Intended for testing and distribution"
          
          echo "Creating release with tag $TAG..."
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest \
            "$APK_PATH" \
            "$DEBUG_AAB_PATH" \
            "$RELEASE_AAB_PATH"

      - name: Report download results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RUN_NUMBER="${{ github.run_number }}"
          TAG="apk-aab-build-${RUN_NUMBER}-${{ github.run_attempt }}"
          APK_NAME="${{ steps.prepare_assets.outputs.apk_name }}"
          DEBUG_AAB_NAME="${{ steps.prepare_assets.outputs.debug_aab_name }}"
          RELEASE_AAB_NAME="${{ steps.prepare_assets.outputs.release_aab_name }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$TAG" || true
            REPO_URL="https://github.com/${{ github.repository }}"
            RELEASE_URL="$REPO_URL/releases/tag/$TAG"
            
            {
              echo "### 🎉 APK & App Bundle Release Successful!"
              echo "- **Release Tag**: \`$TAG\`"
              echo "- **Direct Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Download APK**: $APK_NAME"
              echo "- **Download Debug AAB**: $DEBUG_AAB_NAME"
              echo "- **Download Release AAB**: $RELEASE_AAB_NAME (built via \`gradle :app:bundleRelease\`)"
              echo "- **Backups**: Normal Actions artifacts \`app-debug-apk\`, \`app-debug-aab\`, and \`app-release-aab\` are also available."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Warning: GitHub Release publishing failed or was skipped, but the APK/AAB builds and Actions artifact uploads succeeded."
            {
              echo "### ⚠️ Build Succeeded (Release Publishing Failed)"
              echo "- The APK and AAB builds and Actions artifact uploads completed successfully."
              echo "- Release publishing encountered an error and could not complete automatically."
              echo "- You can download the APK and AABs from the Actions artifacts section."
            } >> $GITHUB_STEP_SUMMARY
          fi
