name: Build and Release Debug APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version: $JAVA_VERSION"
          JAVA_MAJOR=$(echo "$JAVA_VERSION" | awk -F'.' '{print $1}')
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VERSION" | awk -F'.' '{print $2}')
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer, found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java version verification passed: >= 17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Error: Failed to create debug keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified at $KEYSTORE_PATH"

      - name: Build debug APK and AAB
        run: |
          gradle :app:assembleDebug :app:bundleDebug --stacktrace --no-daemon

      - name: Verify APK and AAB
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          AAB_PATH="app/build/outputs/bundle/debug/app-debug.aab"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          
          if [ ! -f "$AAB_PATH" ]; then
            echo "Error: Expected AAB not found at $AAB_PATH"
            exit 1
          fi
          if [ ! -s "$AAB_PATH" ]; then
            echo "Error: AAB file is empty."
            exit 1
          fi
          
          echo "APK and AAB verification passed successfully."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload debug AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Prepare release assets
        id: prepare_assets
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          SANITIZED_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          RUN_NUMBER="${{ github.run_number }}"
          
          ASSET_DIR=$(mktemp -d)
          
          APK_NAME="${SANITIZED_REPO}-debug-build-${RUN_NUMBER}.apk"
          AAB_NAME="${SANITIZED_REPO}-debug-build-${RUN_NUMBER}.aab"
          
          APK_DEST="$ASSET_DIR/$APK_NAME"
          AAB_DEST="$ASSET_DIR/$AAB_NAME"
          
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_DEST"
          cp app/build/outputs/bundle/debug/app-debug.aab "$AAB_DEST"
          
          if [ ! -f "$APK_DEST" ] || [ ! -s "$APK_DEST" ] || [ ! -f "$AAB_DEST" ] || [ ! -s "$AAB_DEST" ]; then
            echo "Error: Failed to prepare release assets."
            exit 1
          fi
          
          echo "Prepared release assets in $ASSET_DIR"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "aab_path=$AAB_DEST" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "aab_name=$AAB_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK and AAB to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          APK_PATH="${{ steps.prepare_assets.outputs.apk_path }}"
          AAB_PATH="${{ steps.prepare_assets.outputs.aab_path }}"
          
          RUN_NUMBER="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          TAG="debug-apk-aab-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          TITLE="Debug APK & AAB Build #${RUN_NUMBER}"
          
          NOTES="This is an automatically generated debug APK and AAB build.
          - Built by GitHub Actions
          - Run Number: ${RUN_NUMBER}
          - Run Attempt: ${RUN_ATTEMPT}
          - Source Commit SHA: ${{ github.sha }}
          - Intended for testing only
          - Not a Play Store production release
          - Signed with temporary debug keystore"
          
          echo "Creating release with tag $TAG..."
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest \
            "$APK_PATH" \
            "$AAB_PATH"

      - name: Report download results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RUN_NUMBER="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          TAG="debug-apk-aab-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          APK_NAME="${{ steps.prepare_assets.outputs.apk_name }}"
          AAB_NAME="${{ steps.prepare_assets.outputs.aab_name }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$TAG" || true
            REPO_URL="https://github.com/${{ github.repository }}"
            RELEASE_URL="$REPO_URL/releases/tag/$TAG"
            
            {
              echo "### 🎉 Debug APK & AAB Release Successful!"
              echo "- **Release Tag**: \`$TAG\`"
              echo "- **Direct Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Download APK**: $APK_NAME (available under release **Assets**)"
              echo "- **Download AAB**: $AAB_NAME (available under release **Assets**)"
              echo "- **Backups**: Normal Actions artifacts \`app-debug-apk\` and \`app-debug-aab\` are also available."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Warning: GitHub Release publishing failed or was skipped, but APK/AAB builds and Actions artifact uploads succeeded."
            {
              echo "### ⚠️ Debug APK & AAB Build Succeeded (Release Publishing Failed)"
              echo "- The APK & AAB builds and Actions artifact uploads (`app-debug-apk`, `app-debug-aab`) completed successfully."
              echo "- Release publishing encountered an error and could not complete automatically."
              echo "- You can download both files from the Actions artifacts section."
            } >> $GITHUB_STEP_SUMMARY
          fi
